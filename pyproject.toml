[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "verifyref"
version = "1.0.0"
description = "Academic reference verification tool with multi-database search and AI-powered fraud detection"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.8"
authors = [
    { name = "Hosein Hadipour", email = "hsn.hadipour@gmail.com" }
]
keywords = [
    "academic",
    "references",
    "verification",
    "bibliography",
    "fraud-detection",
    "citation",
    "research",
    "pdf",
    "grobid",
    "retraction",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing",
    "Topic :: Education",
]
dependencies = [
    "requests>=2.28.0,<3.0.0",
    "feedparser>=6.0.10,<7.0.0",
    "rich>=13.0.0,<14.0.0",
    "scholarly>=1.7.11,<2.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "PyMuPDF>=1.23.0",
]

[project.optional-dependencies]
ai = [
    "openai>=1.0.0,<2.0.0",
    "google-generativeai>=0.3.0",
    "groq>=0.4.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "types-requests>=2.28.0",
    "pre-commit>=3.0.0",
]
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=2.0.0",
]

[project.scripts]
verifyref = "verifyref:main"

[project.urls]
Homepage = "https://github.com/hadipourh/verifyref"
Documentation = "https://github.com/hadipourh/verifyref#readme"
Repository = "https://github.com/hadipourh/verifyref.git"
Issues = "https://github.com/hadipourh/verifyref/issues"
Changelog = "https://github.com/hadipourh/verifyref/releases"

[tool.hatch.build.targets.sdist]
include = [
    "/verifyref.py",
    "/config.py",
    "/exceptions.py",
    "/__init__.py",
    "/grobid/",
    "/extractor/",
    "/verifier/",
    "/utils/",
    "/README.md",
    "/LICENSE",
    "/requirements.txt",
]
exclude = [
    "*.pdf",
    "__pycache__/",
    ".git/",
    ".venv/",
]

[tool.hatch.build]
include = [
    "verifyref.py",
    "config.py",
    "exceptions.py",
    "__init__.py",
    "grobid/*.py",
    "extractor/*.py", 
    "verifier/*.py",
    "utils/*.py",
]
exclude = [
    "test/",
    "tests/",
    "*.pdf",
    "__pycache__/",
]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function call in default argument
    "SIM108", # ternary operator
]

[tool.ruff.lint.isort]
known-first-party = ["verifyref", "verifier", "extractor", "grobid", "utils"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Gradual typing
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "test"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "integration: marks tests as integration tests (require external services)",
    "slow: marks tests as slow running",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["verifyref", "verifier", "extractor", "grobid", "utils"]
omit = ["*/__pycache__/*", "*/test/*", "*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
